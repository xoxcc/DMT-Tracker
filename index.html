/* ================= data: Supabase ================= */
function q2(v) { return '"' + String(v).replace(/["\\*]/g, "") + '"'; }
function supaApi() {

  const CASES = "crm_cases";
  function filt(q, f) {
    if (f.from) q = q.gte("case_date", f.from);
    if (f.to) q = q.lte("case_date", f.to);
    if (f.channel) q = q.eq("channel", f.channel);
    if (f.topic === "__none") q = q.is("topic", null); else if (f.topic) q = q.eq("topic", f.topic);
    if (f.sub === "__none") q = q.is("sub_issue", null); else if (f.sub) q = q.eq("sub_issue", f.sub);
    if (f.state === "__none") q = q.is("state", null); else if (f.state) q = q.eq("state", f.state);
    if (f.status) q = q.eq("status", f.status);
    if (f.staff) q = q.eq("staff_email", f.staff);
    const s = (f.q || "").trim();
    if (s) {
      const parts = ["description", "contact", "dealer_id", "dealer_name", "case_ref", "issue_ref", "topic", "assigned_to"].map(c => c + ".ilike." + q2("*" + s + "*"));
      const digits = s.replace(/\D/g, "");
      if (digits.length >= 4) { const d = digits.startsWith("60") ? digits.slice(2) : digits.replace(/^0/, ""); parts.push("contact_norm.ilike." + q2("*" + d + "*"), "dealer_phone_norm.ilike." + q2("*" + d + "*")); }
      const n = s.replace(/^#/, "");
      if (/^\d{1,9}$/.test(n)) parts.push("case_no.eq." + Number(n));
      q = q.or(parts.join(","));
    }
    return q;
  }
  return {
    sb,
    async session() { const { data } = await sb.auth.getSession(); return data.session; },
    async signIn(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
    async microsoft() { const { error } = await sb.auth.signInWithOAuth({ provider: "azure", options: { scopes: "email openid profile", redirectTo: location.origin + location.pathname } }); if (error) throw error; },
    async reset(email) { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (error) throw error; },
    async setPassword(pw) { const { error } = await sb.auth.updateUser({ password: pw, data: { temp_password: false } }); if (error) throw error; },
    async signOut() { await sb.auth.signOut(); location.replace(location.pathname); },
    async members() { const { data, error } = await sb.from("crm_members").select("*").order("sort").order("name"); if (error) throw error; return data || []; },
    async settings() { const { data, error } = await sb.from("crm_settings").select("*").eq("id", 1).maybeSingle(); if (error) throw error; return data; },
    async saveSettings(s) { const { error } = await sb.from("crm_settings").update({ topics: s.topics, sub_issues: s.subs, channels: s.channels, states: s.states, campaign_audience: s.audience, templates: s.templates, updated_at: new Date().toISOString() }).eq("id", 1); if (error) throw error; },
    async adminLogins() { const { data, error } = await sb.rpc("crm_admin_logins"); if (error) throw error; return data || []; },
    async adminSetPassword(email, pw) { const { data, error } = await sb.rpc("crm_admin_set_password", { target_email: email, new_password: pw }); if (error) throw error; return data; },
    async insertCases(rows) { for (let i = 0; i < rows.length; i += 200) { const { error } = await sb.from(CASES).insert(rows.slice(i, i + 200)); if (error) throw error; } },

      if (error) throw error; return { path, name: file.name, size: file.size, type: file.type };
    },

    async removeMemos(paths) { if (paths.length) await sb.storage.from("crm-memos").remove(paths); },

    subscribe(cb) { sb.channel("crm-live").on("postgres_changes", { event: "*", schema: "public", table: CASES }, cb).on("postgres_changes", { event: "*", schema: "public", table: "crm_campaigns" }, cb).subscribe(); }
  };
}

// Login column: status from the database plus Reset / Create login (managers only; not for managers' accounts).

function tempPassword() {

}

document.addEventListener("keydown", e => {
